
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoAngelCreations | Official Store</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #333;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background-color: white;
            border-bottom: 1px solid #ddd;
        }
        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 3rem 5%;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-placeholder {
            width: 100%;
            height: 200px;
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        .price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .buy-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn:hover {
            background-color: #c0392b;
        }
        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--primary);
            color: white;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GeoAngelCreations</div>
        <nav>
            <!-- Add a cart icon here later -->
            Shop | About | Contact
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to GeoAngelCreations</h2>
        <p>Discover our unique, hand-picked collections.</p>
    </section>

    <section class="products">
        <!-- Product 1 -->
        <div class="product-card">
            <div class="product-placeholder"></div>
            <h3>Signature Item One</h3>
            <p class="price">$29.99</p>
            <button class="buy-btn">Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <div class="product-placeholder"></div>
            <h3>Signature Item Two</h3>
            <p class="price">$39.99</p>
            <button class="buy-btn">Add to Cart</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <div class="product-placeholder"></div>
            <h3>Signature Item Three</h3>
            <p class="price">$49.99</p>
            <button class="buy-btn">Add to Cart</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 GeoAngelCreations. All rights reserved.</p>
    </footer>

</body>
</html>
